name: shipments-hub

on:
  push:
    paths: ["apps/shipments-hub/**", ".github/workflows/shipments-hub.yml"]
  pull_request:
    paths: ["apps/shipments-hub/**", ".github/workflows/shipments-hub.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shipments-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
      - run: docker build -t shipments-hub .
